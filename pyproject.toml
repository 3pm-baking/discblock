[project]
name = "discblock"
version = "0.1.0"
description = "Agent-authored interactive UI blocks for Discord bots."
readme = "README.md"
license = "MIT"
authors = [{ name = "Will Dean", email = "will@germanbakingasheville.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "discord-py>=2.6.0",
]
keywords = [
    "discord",
    "discord-bot",
    "llm",
    "agents",
    "ui",
    "components",
    "buttons",
    "interactive",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
opencode = ["opencode-ai>=0.1.0a1"]

[project.scripts]
discblock-example = "discblock.examples.opencode_bot:main"

[project.urls]
Repository = "https://github.com/3pm-baking/discblock"
Issues = "https://github.com/3pm-baking/discblock/issues"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discblock"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23", "ruff>=0.5.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B", "C4", "SIM"]
ignore = ["D105", "D107", "D203", "D212", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "E501"]
"src/discblock/examples/**/*.py" = ["D"]
